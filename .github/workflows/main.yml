name: Main

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Set up foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: "v1.8.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test (types)
        run: bun run --cwd packages/core test:typecheck
 
  bundle:
    name: Bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Bundle
        run: bun run --cwd examples/with-nextjs/frontend build

  test:
    name: Test [core]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        database: [Postgres, PGlite]
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Note: The runner image has Postgres preinstalled.
      - name: Setup Postgres
        if: ${{ matrix.database == 'Postgres' }}
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'" -c "SELECT version()"

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Set up foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: "v1.8.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        env:
          DATABASE_URL: ${{ matrix.database == 'Postgres' && 'postgresql://postgres:postgres@localhost:5432/postgres' || '' }}
          # Core suite expects node-postgres; Bun.SQL is covered by *.bun.test.ts.
          PONDER_DATABASE_DRIVER: pg
        run: bun run --cwd packages/core test:bun


  test-bun-sql:
    name: Test [core] Bun.SQL (production default)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Postgres
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'" -c "SELECT version()"

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Set up foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: "v1.8.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Production default: Bun.SQL (do not set PONDER_DATABASE_DRIVER=pg).
      # Separate bun test processes avoid cross-app search_path / module-cache bleed.
      - name: Test Bun.SQL unit + slices
        working-directory: packages/core
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          CI: "1"
        run: |
          bun test \
            src/database/*.bun.test.ts \
            src/drizzle/json.bun.test.ts \
            src/bin/utils/bunNativeServe.bun.test.ts \
            src/server/bunV1Api.bun.test.ts \
            src/runtime/bun*.bun.test.ts \
            src/build/bunNativeBuild.bun.test.ts

      - name: Test Bun.SQL e2e apps
        working-directory: packages/core
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          CI: "1"
        run: |
          bun test src/_test/e2e/erc20/erc20.test.ts src/_test/e2e/factory/factory.test.ts

      - name: Test Bun.SQL closed-loop start → /v1
        working-directory: packages/core
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          CI: "1"
        run: bun test src/bin/utils/bunNativeApp.e2e.bun.test.ts

  test-create-ponder:
    name: Test [create-ponder]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run --cwd packages/create-ponder test:bun
