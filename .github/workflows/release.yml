# Publish via npm Trusted Publishing (OIDC). No long-lived NPM_TOKEN.
#
# One-time setup (per package on npmjs.com → Settings → Trusted Publisher):
#   Organization or user: chy3xyz
#   Repository:           bponder
#   Workflow filename:    release.yml
#   Environment name:     npm
#   Allowed actions:      Allow npm publish
#
# Packages must already exist on npm (first version is a manual publish).
# Configure Trusted Publisher, then run this workflow within 2 days.
#
# Docs: https://docs.npmjs.com/trusted-publishers/

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Release
    runs-on: ubuntu-24.04
    environment: npm
    outputs:
      binary_tag: ${{ steps.binary_tag.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1 (OIDC). Prefer Node's npm over Bun's.
      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@^11.5.1
          hash -r
          npm --version
          which npm

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Set up foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: "v1.8.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish to npm (OIDC)
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Use system npm (OIDC). Do not set NPM_TOKEN / NODE_AUTH_TOKEN.
          publish-script: bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve binary release tag
        id: binary_tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION="$(
            echo '${{ steps.changesets.outputs.publishedPackages }}' \
              | bun -e 'const p=JSON.parse(await Bun.stdin.text()); const b=p.find(x=>x.name==="bponder"); if(!b) process.exit(2); console.log(b.version)'
          )" || {
            echo "bponder was not in publishedPackages; skipping binary release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  binaries:
    name: Release binaries
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.binary_tag != ''
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.release.outputs.binary_tag }}
    secrets: inherit

  snapshot:
    if: github.ref != 'refs/heads/main'
    name: Release snapshot version
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@^11.5.1
          hash -r
          npm --version

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Set up foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: "v1.8.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version snapshot
        run: |
          snapshot=$(git branch --show-current | tr -cs '[:alnum:]-' '-' | tr '[:upper:]' '[:lower:]' | sed 's/-$//')
          echo "SNAPSHOT=$snapshot" >> "$GITHUB_ENV"
          bunx changeset version --snapshot "$snapshot"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build after versioning: `create-bponder` bundles its `package.json` version.
      - name: Build
        run: bun run build

      - name: Publish snapshot to npm (OIDC)
        run: bunx changeset publish --no-git-tag --tag "$SNAPSHOT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
