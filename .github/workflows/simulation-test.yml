name: Simulation Test

# Requires a self-hosted runner + DATABASE_URL / PONDER_RPC_URL_* secrets.
# Schedule disabled on this fork until those are provisioned (queued forever otherwise).
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Note: Seeds that found bugs. These run on every run, including scheduled runs.
  simulation-test-known-failures:
    name: Simulation Test Known Failures
    runs-on: self-hosted
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_id: uniswap-v4
            seed: 451a2d0e399fd375369d53bf04b652ee80730fc215963818f1a387d2aa78b198
          - app_id: uniswap-v4
            seed: 4ae5cc4f3594b76798249f1adb56d42dc1b544975a781f4c93b7e565507bd9cf
          - app_id: feature-multichain
            seed: e1802a439f23d2706e1a50b4b13aa743b931f8e2dcf1d7e39ea4b6e7dbd34640
          # Known-fail: crash recovery / migrate under `ordering: "experimental_isolated"`.
          # Upstream note: ponder-sh/ponder@e8eae639 database/index.ts (~L917 era). Current fork still
          # has the migrate/lock path in packages/core/src/database/index.ts (line drift; logic retained).
          # Status 2026-11-24: not re-verified green — keep until a local/CI seed pass.
          - app_id: assessment
            seed: 3938fff044d4feb11b33dbdb57bae142ec6d73029611ddff14d9d4b11ada2fe6
          # Known-fail: multichain reorg moves executed→pending (`realtime.ts` reorg case).
          # Upstream: ponder-sh/ponder@e8eae639 realtime.ts:572-585. Current: packages/core/src/runtime/realtime.ts
          # still has the same reorgIndex / pendingEvents concat pattern (~L295+). Status 2026-11-24: open.
          - app_id: assessment
            seed: 8d07d00f53fe5beaf19c06696ea4e00120112ef753404e576372fc1fe18f4d13
          # Known-fail: omnichain pending-event checkpoint while historical sync (`historical.ts`).
          # Upstream: ponder-sh/ponder@e8eae639 historical.ts:281-303. Current: packages/core/src/runtime/historical.ts
          # still partitions events onto pendingEvents when checkpoint > omnichainTo (~L270+). Status 2026-11-24: open.
          - app_id: uniswap-v4
            seed: 31752f35f6443147d8fda82cb9b3c4a878292e9b3c52f2e36c582dba943872ed
          # Known-fail: harness finalized-block calc after crash recovery (simulation-test script, not core).
          # Upstream: ponder-sh/ponder@e8eae639 integration-test/.../index.ts:1248-1270 → simulation-test/src/index.ts.
          # Status 2026-11-24: open (test infra).
          - app_id: project-uniswap-v3-flash
            seed: 98c5c3716e33ba8ea2a8ba8d36f942cf1c2fb368f2d33a5f6bf434e087487bce

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile

      - run: bun run build
      - run: bun install --cwd simulation-test

      - name: Test ${{ matrix.app_id }} ${{ matrix.seed }}
        run: |
          cd simulation-test
          bun run test ${{ matrix.app_id }}
        env:
          SEED: ${{ matrix.seed }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PONDER_RPC_URL_1: ${{ secrets.PONDER_RPC_URL_1 }}
          PONDER_RPC_URL_10: ${{ secrets.PONDER_RPC_URL_10 }}
          PONDER_RPC_URL_130: ${{ secrets.PONDER_RPC_URL_130 }}
          PONDER_RPC_URL_8453: ${{ secrets.PONDER_RPC_URL_8453 }}
          # onBuild fault injection is Vite-path only; harness also swaps pg drizzle clients.
          PONDER_USE_VITE: "1"
          PONDER_DATABASE_DRIVER: pg
          PGDATABASE: railway
          PGSSLMODE: disable
          NODE_ENV: ci

  simulation-test-fuzz:
    name: Simulation Test Fuzz
    runs-on: self-hosted
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app_id:
          - "assessment"
          - "feature-multichain"
          - "project-uniswap-v3-flash"
          - "reference-erc20"
          - "super-assessment"
          - "uniswap-v4"
          - "the-compact"
          - "basepaint"
        iteration: [0, 1, 2]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile

      - run: bun run build
      - run: bun install --cwd simulation-test

      - name: Test ${{ matrix.app_id }} ${{ matrix.iteration }}
        run: |
          cd simulation-test
          bun run test ${{ matrix.app_id }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PONDER_RPC_URL_1: ${{ secrets.PONDER_RPC_URL_1 }}
          PONDER_RPC_URL_10: ${{ secrets.PONDER_RPC_URL_10 }}
          PONDER_RPC_URL_130: ${{ secrets.PONDER_RPC_URL_130 }}
          PONDER_RPC_URL_8453: ${{ secrets.PONDER_RPC_URL_8453 }}
          PONDER_USE_VITE: "1"
          PONDER_DATABASE_DRIVER: pg
          PGDATABASE: railway
          PGSSLMODE: disable
          NODE_ENV: ci

  cleanup-simulation-test:
    name: Cleanup Simulation Test Databases
    needs: [simulation-test-known-failures, simulation-test-fuzz]
    if: ${{ always() }}
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun install --cwd simulation-test
      - run: |
          cd simulation-test
          bun run src/cleanup-database.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGDATABASE: railway
          PGSSLMODE: disable
          NODE_ENV: ci
