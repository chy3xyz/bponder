name: Utils

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  test-get-logs:
    name: Test getLogsRetryHelper
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: 
        viem-version: ['1', '2']
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require live RPC secrets
        id: secrets
        env:
          RPC_URL_ALCHEMY_1: ${{ secrets.RPC_URL_ALCHEMY_1 }}
          RPC_URL_INFURA_1: ${{ secrets.RPC_URL_INFURA_1 }}
          RPC_URL_QUICKNODE_1: ${{ secrets.RPC_URL_QUICKNODE_1 }}
        run: |
          if [ -z "$RPC_URL_ALCHEMY_1" ] || [ -z "$RPC_URL_INFURA_1" ] || [ -z "$RPC_URL_QUICKNODE_1" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::RPC_URL_* secrets are unset; skipping live getLogsRetryHelper suite"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up bun
        if: steps.secrets.outputs.skip != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        if: steps.secrets.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      # Root workspace install (Bun has no pnpm-style `-w`; add at repo root).
      - if: steps.secrets.outputs.skip != 'true'
        run: bun add -d viem@${{ matrix.viem-version }}

      - name: Test
        if: steps.secrets.outputs.skip != 'true'
        run: bun run --cwd packages/utils test src/_test
        env:
          CI: "1"
          RPC_URL_ALCHEMY_1: ${{ secrets.RPC_URL_ALCHEMY_1 }}
          RPC_URL_INFURA_1: ${{ secrets.RPC_URL_INFURA_1 }}
          RPC_URL_QUICKNODE_1: ${{ secrets.RPC_URL_QUICKNODE_1 }}
